{% extends "mainapp/base.html" %}
{% load static %}

{% block title %}MathLLM Homepage{% endblock %}

{% block page_styles %}
    <link rel="stylesheet" type="text/css" href="{% static 'mainapp/homepage.css' %}">
{% endblock %}

{% block page_content %}
    {% include "mainapp/partials/theme_switcher.html" %}

    <div class="mainsection">
        <div class="title">
            <h1>MathLLM</h1>
        </div>
        <div class="buttons">
            <button class="solverbutton" onclick="location.href='/solver'">Go to Solver</button>
            <button class="generatorbutton" onclick="location.href='/generator'">Go to Problem Generator</button>
        </div>
    </div>

    <div class="lower-left">
        <button class="belowbuttons" onclick="location.href='/about'">About</button>
    </div>

    <div class="lower-right">
        <button class="belowbuttons" onclick="location.href='/llms'">LLMs to Use</button>
    </div>
{% endblock %}
