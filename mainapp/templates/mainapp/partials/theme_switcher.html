<div class="theme-switcher page-theme-switcher" aria-label="Theme selector">
    <button type="button" class="theme-toggle" id="theme-toggle" aria-expanded="false" aria-controls="theme-menu">
        <span class="theme-toggle-label">Theme</span>
        <span class="theme-current-label" id="theme-current-label">Dark</span>
    </button>
    <div id="theme-menu" class="theme-menu" role="menu" aria-label="Select a theme">
        <button type="button" class="theme-option is-selected" data-theme-option="dark" role="menuitem" aria-checked="true">Dark</button>
        <button type="button" class="theme-option" data-theme-option="light" role="menuitem" aria-checked="false">Light</button>
        <button type="button" class="theme-option" data-theme-option="system" role="menuitem" aria-checked="false">System</button>
    </div>
</div>
